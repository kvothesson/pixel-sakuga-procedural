<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Otra Vez · Ep. 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
/* Layout: short vertical 9:16 centrado, gancho arriba, subtítulos abajo, controles debajo. Look nocturno fijo (single-theme a propósito). */
:root{
  --night:#07050d;
  --ink:#ece8f6;
  --dim:#8a83a6;
  --blue:#4fb4ff;
  --red:#ff2e45;
  --f-pixel:"DotGothic16","MS Gothic",ui-monospace,monospace;
  color-scheme:dark;
}
html,body{background:var(--night);color:var(--ink);margin:0}
body{font-family:var(--f-pixel);padding-inline:16px;padding-block:16px 24px;display:flex;flex-direction:column;align-items:center;gap:12px}
.stage{position:relative;width:min(100%,calc(82vh * 9 / 16));aspect-ratio:9/16;max-width:100%;overflow:hidden;background:#000;cursor:pointer;border-radius:10px;box-shadow:0 0 0 2px #2a0f1c}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated}
.hook{position:absolute;top:13%;left:0;right:0;text-align:center;pointer-events:none;font-size:clamp(20px,7vw,34px);letter-spacing:.08em;color:#fff;
  text-shadow:3px 0 #1f5fa8,-3px 0 #000,0 3px #000,0 -3px #000}
.hook small{display:block;font-size:.45em;color:#ffd84a;letter-spacing:.2em;text-shadow:2px 0 #000,-2px 0 #000,0 2px #000}
.sub{position:absolute;left:50%;bottom:17%;transform:translateX(-50%);width:92%;text-align:center;pointer-events:none;
  font-size:clamp(18px,5.5vw,26px);color:#fff;text-shadow:2px 0 #000,-2px 0 #000,0 2px #000,0 -2px #000}
.sub small{display:block;font-size:.62em;color:#ffd84a;letter-spacing:.1em}
.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;color:var(--dim);font-size:14px}
button{font:inherit;color:var(--ink);background:#140d22;border:2px solid #3a2a5c;padding:6px 14px;cursor:pointer;letter-spacing:.06em}
button:hover{border-color:var(--red);color:#fff}
button[aria-pressed="true"]{border-color:var(--red);color:#fff}
button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
</style>
</head><body>
<div class="stage" id="stage">
  <canvas id="c" aria-label="Short vertical en pixel art: en una azotea con viento, ella finta, cae en picada y choca contra él; a él se le cae la capucha"></canvas>
  <div class="hook" id="hook"></div>
  <div class="sub" id="sub"></div>
</div>
<div class="controls">
  <button id="sound" type="button" aria-pressed="false">♪ ACTIVAR SONIDO</button>
  <button id="toggle" type="button">❚❚ PAUSA</button>
</div>
<script src="../../engine/sakuga.js"></script>
<script>
(()=>{
const S=window.Sakuga,{P,lerp,ease,easeIn,easeOut,clamp,segAt,lerpPose,rotPt,q8,q12}=S;
const LOOP=8.4;

// ---------- personajes ----------
const BLUE={head:'hood',
  pal:{coat:'#232a5c',coatD:'#161a3c',pants:'#13152c',skin:'#f0c4a0',glove:'#d8e8ff',hood:'#1b2350',hair:'#2a3060',tip:'#4fb4ff',aura:'#4fb4ff',dark:'#1f5fa8'},
  chains:[
    {key:'coat',anchor:'hip',off:[-5,-5],n:3,len:8,w:[8,11],col:'coatD',grav:1.3,wind:.8},
    {key:'braid',anchor:'head',off:[-7,-2],n:7,len:6,w:[3,2],col:'hair',tip:'tip',tipFrom:5,when:c=>c.hoodDown}
  ]};
const RED={head:'hair',
  pal:{coat:'#4a1222',coatD:'#2c0a14',pants:'#1c0810',skin:'#e0b090',glove:'#e0b090',hair:'#15060c',tip:'#c41a34',scarf:'#d81e3a',aura:'#ff2e45',dark:'#8a1024'},
  chains:[
    {key:'coat',anchor:'hip',off:[-5,-5],n:3,len:8,w:[8,11],col:'coatD',grav:1.3,wind:.8},
    {key:'scarf',anchor:'chest',off:[-2,-3],n:7,len:8,w:[4,2],col:'scarf',grav:.9,damp:.88},
    {key:'pony',anchor:'head',off:[-6,-6],n:6,len:7,w:[5,1.5],col:'hair',tip:'tip',tipFrom:4,grav:1,damp:.9}
  ]};

// ---------- coreografía ----------
// O ojos de ella se abren · W viento · A2 anticipación · B embestida · F finta (se disuelve) · U cae en picada · H hit-stop · C impact
// D choque (D2 pies) · X estallido y derrape · S enfrentamiento · Z empuje a su cara · L ojos se cierran (= cuadro 0)
const T={wide:.9,ant:1.75,dash:2.0,feint:2.42,drop:2.6,block:2.72,hit:3.0,imp:3.1,clash:3.55,feet:4.0,feet2:4.3,flash:4.35,burst:4.55,land:5.0,hood:4.9,rise:5.35,stand:5.3,push:6.5,close:7.2};
const BLOCK_X=14,FEINT_X=-14;
const CONTACT=(()=>{const[x,y]=rotPt({dir:-1},[3,-106]);return[BLOCK_X+x,y]})();
const RED_ROT=.22;
const RED_AT=(()=>{const[fx,fy]=rotPt({dir:1,rot:RED_ROT},P.divekick.lF);return[CONTACT[0]-fx,CONTACT[1]-fy]})();
const DROP_FROM=[RED_AT[0]-40,RED_AT[1]-190];

function state(t){
  const t12=q12(t),sg=(a,c)=>segAt(t,a,c),sg12=(a,c)=>segAt(t12,a,c);
  const breath=o=>Math.floor(q8(t)*2.67+o)%2?P.stance2:P.stance;
  const blue={id:'blue',pose:breath(0),dir:-1,x:55},red={id:'red',pose:breath(1),dir:1,x:-55};
  const s={phase:'O',cam:{zoom:1,camX:0,camY:-70},chars:[]};
  if(t<T.wide){s.phase='O';return s}
  if(t>=T.close){s.phase='L';return s}
  s.chars=[red,blue];
  if(t<T.ant){s.phase='W';s.cam={zoom:1,camX:lerp(-20,0,sg(T.wide,T.ant)),camY:lerp(-110,-85,ease(sg(T.wide,T.ant)))}}
  else if(t<T.dash){s.phase='A2';const k=ease(sg12(T.ant,T.ant+.2));blue.pose=red.pose=lerpPose(P.stance,P.crouch,k);s.cam={zoom:1.12,camY:-80}}
  else if(t<T.feint){s.phase='B';const k=easeIn(sg12(T.dash,T.feint));
    red.x=lerp(-55,FEINT_X,k);blue.x=lerp(55,BLOCK_X,k);red.pose=lerpPose(P.crouch,P.dash,clamp(k*5));blue.pose=lerpPose(P.crouch,k>.7?P.strike:P.dash,clamp(k*5));
    const gk=i=>easeIn(sg12(T.dash,T.feint)-i/12/(T.feint-T.dash));
    red.ghosts=[1,2,3].map(i=>[lerp(-55,FEINT_X,gk(i)),0]);blue.ghosts=[1,2,3].map(i=>[lerp(55,BLOCK_X,gk(i)),0]);
    s.cam={zoom:lerp(1.12,1.55,k),camY:-80,shake:k*2};}
  else if(t<T.hit){
    blue.x=BLOCK_X;blue.pose=t<T.block?P.strike:lerpPose(P.strike,P.block,clamp((t12-T.block)*6));
    const fk=sg(T.feint,T.drop+.05);
    s.chars=[blue];
    if(fk<1)s.chars.unshift({id:'redFeint',pose:P.dash,dir:1,x:FEINT_X,dissolve:1-fk});
    if(t>=T.drop){const k=sg12(T.drop,T.hit);red.pose=P.divekick;red.rot=RED_ROT;red.x=lerp(DROP_FROM[0],RED_AT[0],k*k);red.y=lerp(DROP_FROM[1],RED_AT[1],k*k);
      red.ghosts=[1,2,3].map(i=>{const kk=clamp(k-i/12/(T.hit-T.drop));return[lerp(DROP_FROM[0],RED_AT[0],kk*kk),lerp(DROP_FROM[1],RED_AT[1],kk*kk)]});
      s.chars.push(red)}
    s.phase=t<T.drop?'F':'U';
    s.cam=t<T.drop?{zoom:1.55,camX:0,camY:-80}:{zoom:1.3,camX:CONTACT[0],camY:lerp(-170,-120,ease(sg(T.drop,T.hit))),shake:1};
  }
  else if(t<T.burst){
    blue.x=BLOCK_X;blue.pose=P.block;red.pose=P.divekick;red.rot=RED_ROT;red.x=RED_AT[0];red.y=RED_AT[1];
    if(t<T.imp){s.phase='H';s.freeze=T.hit-.01;s.cam={zoom:1.7,camX:CONTACT[0],camY:-110}}
    else if(t<T.clash){s.phase='C';s.cam={zoom:1.7,camX:CONTACT[0],camY:-110,shake:6}}
    else if(t>=T.feet&&t<T.feet2){s.phase='D2';s.cam={zoom:3.6,camX:BLOCK_X,camY:-8,shake:5}}
    else{s.phase='D';const k=sg(T.clash,T.burst),push=Math.round(Math.sin(t12*9)*2);red.y=RED_AT[1]+push;
      s.cam={zoom:lerp(1.7,1.3,ease(k)),camX:CONTACT[0],camY:-105,shake:lerp(4,1,k)}}
  }
  else if(t<T.push){
    // ella sale despedida hacia atrás con una vuelta; él derrapa y pierde la capucha
    const kr=sg12(T.burst,T.land);
    if(t<T.land){red.pose=P.tuck;red.x=lerp(RED_AT[0],-62,easeOut(kr));red.y=lerp(RED_AT[1],0,kr)-Math.sin(Math.PI*kr)*70;red.rot=-Math.PI*2*kr}
    else{red.x=-62;red.pose=t<T.rise?P.after:lerpPose(P.after,breath(1),ease(sg12(T.rise,T.rise+.25)))}
    const kb=sg12(T.burst,T.burst+.6);blue.x=lerp(BLOCK_X,72,easeOut(kb));blue.pose=t<T.rise+.05?P.after:lerpPose(P.after,breath(0),ease(sg12(T.rise+.05,T.rise+.3)));
    blue.hoodDown=t>=T.hood;blue.skid=1-kb;
    s.phase=t<T.stand?'X':'S';
    s.cam={zoom:lerp(1.15,1.05,ease(sg(T.burst,T.stand))),camX:lerp(CONTACT[0],4,ease(sg(T.burst,T.burst+.4))),camY:lerp(-90,-70,ease(sg(T.burst,T.stand))),shake:t<T.burst+.25?6:0};
  }
  else{
    s.phase='Z';red.x=-62;red.pose=breath(1);blue.x=72;blue.hoodDown=true;
    const k=easeIn(sg(T.push,T.close)),[hx,hy]=rotPt(red,P.stance.head);
    s.cam={zoom:lerp(1.05,7,k),camX:lerp(4,red.x+hx,ease(k*1.4)),camY:lerp(-70,hy,ease(k*1.4))};
  }
  return s;
}
const wind=t=>[-(520+380*Math.sin(t*1.7)+260*Math.sin(t*4.3)+(t>T.stand&&t<T.push?300:0)),-80];

// ---------- dibujo ----------
const LOOK={frame:'#2a0c18',edge:'#ff2e45',rim:'#ff5a6a',iris:['#c41a34','#ff6a7a'],bangs:true,flare:'#ffc8d0'};
function roof(s){
  const{toPx,wrect,R,ditherFill,hash}=S;
  for(let i=-12;i<13;i++){const w=30+hash(i)*40,h=20+hash(i+50)*60,x=i*50-s.cam.camX*.4;wrect(x,-h+30,w,h+400,'#0d0817');
    for(let j=0;j<5;j++)if(hash(i*13+j)>.4){const wx=x+4+hash(i*7+j)*(w-8),wy=-h+36+hash(i*3+j)*60;wrect(wx,wy,2.5,2.5,hash(i+j)>.6?'#ffb070':'#7080ff')}}
  wrect(-110,-200,4,200,'#0a0611');wrect(-124,-170,32,3,'#0a0611');if(Math.floor(S.t*2)%2)wrect(-111,-205,6,5,'#ff2e45');
  const[x0,gy]=toPx(-120,0),[x1]=toPx(120,0);
  R(x0,gy,x1-x0,S.PH,'#160f20');ditherFill(.5,'#0a0710',Math.max(0,Math.round(x0)),gy+Math.round((S.PH-gy)*.35),Math.min(S.PW,Math.round(x1)),S.PH);
  R(x0,gy,x1-x0,1,'#7a1830');
  for(let i=0;i<4;i++){const[px,py]=toPx(-90+i*55,6+i*4);R(px,py,10*S.cam.k,1,'#5a1830');R(px+2*S.cam.k,py,4*S.cam.k,1,'#d8243a')}
}
// el viento se ve: trazos horizontales que cruzan hacia la izquierda
function windStreaks(power){const{hash,line,PW,PH}=S;const f=Math.floor(S.t*12);
  for(let i=0;i<Math.round(14*power);i++){const y=hash(f*7+i)*PH,l=PW*(.1+hash(f*3+i)*.25),x=(hash(i*5)*PW*1.5-S.t*PW*3*(1+hash(i)))%(PW*1.5);
    const xx=((x%(PW*1.5))+PW*1.5)%(PW*1.5)-PW*.25;line(xx,y,xx+l,y+l*.04,1,'#3a3458')}}
function ghostsOf(ch,cols){if(!ch.ghosts)return;[2,1,0].forEach(i=>S.figure({...ch,x:ch.ghosts[i][0],y:ch.ghosts[i][1]||ch.y||0},'ink',cols[i]))}

function render(s){
  const{toPx,figure,ditherFill,ditherDisc,disc,ring,seg}=S,t=S.t;
  if(s.phase==='O'){S.closeup(ease(seg(.1,.4)),t>.4?1-seg(.4,.85):0,LOOK);return}
  if(s.phase==='L'){S.closeup(1-ease(seg(7.7,8.05)),0,LOOK);ditherFill(1-seg(T.close,T.close+.2),'#020105');return}
  const byId=Object.fromEntries(s.chars.map(c=>[c.id,c]));
  if(s.phase==='C'){S.impact(T.imp,CONTACT[0],CONTACT[1],s.chars,'撃');return}
  S.sky(['#04030a','#0a0518','#140826','#220a2a','#341028'],{x:S.PW*.7-s.cam.camX*.03*S.cam.k,y:toPx(0,-330)[1]*.3+S.PH*.1,r:S.PW*.18});
  roof(s);
  const blue=byId.blue,red=byId.red;
  const late=s.phase==='X'||s.phase==='S'||s.phase==='Z';
  const bp=late?.35:s.phase==='W'?.25+.5*seg(T.wide,T.ant):1,rp=late?.35:bp;
  if(blue)S.aura(blue.x,-50,BLUE.pal,bp);
  if(red){const[ax,ay]=S.worldPt(red,P.stance.chest);S.aura(ax,ay+10,RED.pal,rp,55)}
  if(s.phase==='D'||s.phase==='D2')S.clash(CONTACT[0],CONTACT[1],T.clash,T.burst,BLOCK_X);
  if(s.phase==='D2')S.feetCut(BLOCK_X,T.feet,T.feet2);
  if(blue)S.embers(blue.x,0,BLUE.pal,26,bp,1);
  if(red&&!red.y)S.embers(red.x,0,RED.pal,26,rp,50);
  if(blue)ghostsOf(blue,['#4fb4ff','#1f5fa8','#122a50']);
  if(red)ghostsOf(red,['#ff2e45','#8a1024','#40081a']);
  // la finta: se disuelve en dither cuando el puño la atraviesa
  if(byId.redFeint)S.dissolve(byId.redFeint.dissolve,()=>figure(byId.redFeint,'glow'));
  if(red)figure(red,'glow');if(blue)figure(blue,'glow');
  if(blue&&blue.skid>0)S.skidSparks(blue.x+8,-1,blue.skid);
  if(s.phase==='X'&&t>=T.hood&&t<T.hood+.35){const[hx,hy]=toPx(...S.worldPt(blue,blue.pose.head));ditherDisc(hx,hy,(16+seg(T.hood,T.hood+.35)*20)*S.cam.k,'#c8c0e8',.6*(1-seg(T.hood,T.hood+.35)))}
  if(s.phase==='H'){const[cx,cy]=toPx(...CONTACT);disc(cx,cy,6*S.cam.k,'#ffffff');ring(cx,cy,10*S.cam.k,10*S.cam.k,'#ffffff')}
  if(s.phase==='B'){S.speedLines(0,24);if(t>T.dash+.25)S.focusLines('#e8e0ff',30,2,12)}
  if(s.phase==='F'){S.focusLines('#e8e0ff',30,1,12,...toPx(FEINT_X,-60))}
  if(s.phase==='U'||s.phase==='H')S.speedLines(Math.PI/2+.2,26);
  if(s.phase==='D'){if(t<T.clash+.4)S.focusLines('#e8e0ff',40,2,24,...toPx(...CONTACT));ditherFill(seg(T.flash,T.burst),'#ffffff')}
  if(s.phase==='X')ditherFill(1-seg(T.burst,T.burst+.3),'#ffffff');
  if(s.phase==='Z')ditherFill(seg(T.push+.35,T.close),'#020105');
}
function post(s){if(s.phase!=='C'){S.rain(.6);if(s.phase!=='O'&&s.phase!=='L')windStreaks(s.phase==='S'?1:.6)}}

// ---------- sonido ----------
const X=S.sfx;
const sfx=[
  [.12,()=>X.sting(880)],
  [1.0,()=>S.noise(.8,'bandpass',300,900,.3,1,true)],
  [T.ant,()=>X.inhale(.25)],
  [T.dash,()=>X.whoosh(.45)],
  [T.feint,()=>X.vanish()],
  [T.drop,()=>X.rise(.4)],
  [T.imp,X.boom],
  [T.feet,X.crack],
  [T.burst-.2,()=>X.rise(.2)],
  [T.burst,X.bigBoom],
  [T.burst+.05,()=>X.scrape(.6)],
  [T.hood,X.flap],
  [5.65,X.heartbeat],
  [T.push,()=>S.noise(.7,'lowpass',200,1400,.25,1,true)],
  [8.0,()=>S.noise(.4,'highpass',1500,7000,.18,1,true)]
];
const drone=s=>({O:.05,W:.12,A2:.26,B:.3,F:.3,U:.2,H:0,C:0,D:.22,D2:.22,X:.18,S:.06,Z:.08,L:.03}[s.phase]??0);
const ambience=s=>{const g=Math.abs(wind(S.t)[0]);return{rain:s.phase==='H'||s.phase==='C'?0:.05,wind:s.phase==='H'||s.phase==='C'?0:.05+g/9000,windFreq:300+g*.3}};

S.start({
  loop:LOOP,vertical:true,camCy:.5,reducedT:3.8,
  chars:{blue:BLUE,red:RED,redFeint:RED},
  light:{x:200,rim:'#ff5a6a'},
  state,wind,render,post,sfx,drone,ambience,crackle:s=>s.phase==='D'||s.phase==='D2',
  subs:[[5.65,6.45,'—Ahora sí.','これからだ']],
  hook:[[0,1.2,'ESTA VEZ NO','今度は違う']],
  el:{stage:document.getElementById('stage'),canvas:document.getElementById('c'),toggle:document.getElementById('toggle'),
      sound:document.getElementById('sound'),sub:document.getElementById('sub'),hook:document.getElementById('hook')}
});
})();
</script>
</body></html>
