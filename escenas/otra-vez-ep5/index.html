<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Otra Vez · Ep. 5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
/* Layout: short vertical 9:16 centrado, gancho arriba, subtítulos abajo, controles debajo. Look nocturno fijo (single-theme a propósito). */
:root{
  --night:#07050d;
  --ink:#ece8f6;
  --dim:#8a83a6;
  --blue:#4fb4ff;
  --red:#ff2e45;
  --green:#5bff9e;
  --f-pixel:"DotGothic16","MS Gothic",ui-monospace,monospace;
  color-scheme:dark;
}
html,body{background:var(--night);color:var(--ink);margin:0}
body{font-family:var(--f-pixel);padding-inline:16px;padding-block:16px 24px;display:flex;flex-direction:column;align-items:center;gap:12px}
.stage{position:relative;width:min(100%,calc(82vh * 9 / 16));aspect-ratio:9/16;max-width:100%;overflow:hidden;background:#000;cursor:pointer;border-radius:10px;box-shadow:0 0 0 2px #10261c}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated}
.hook{position:absolute;top:13%;left:0;right:0;text-align:center;pointer-events:none;font-size:clamp(18px,6vw,30px);letter-spacing:.06em;color:#fff;
  text-shadow:3px 0 #0f6a3a,-3px 0 #000,0 3px #000,0 -3px #000}
.hook small{display:block;font-size:.5em;color:#ffd84a;letter-spacing:.2em;text-shadow:2px 0 #000,-2px 0 #000,0 2px #000}
.sub{position:absolute;left:50%;bottom:17%;transform:translateX(-50%);width:92%;text-align:center;pointer-events:none;
  font-size:clamp(18px,5.5vw,26px);color:#fff;text-shadow:2px 0 #000,-2px 0 #000,0 2px #000,0 -2px #000}
.sub small{display:block;font-size:.62em;color:#ffd84a;letter-spacing:.1em}
.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;color:var(--dim);font-size:14px}
button{font:inherit;color:var(--ink);background:#140d22;border:2px solid #3a2a5c;padding:6px 14px;cursor:pointer;letter-spacing:.06em}
button:hover{border-color:var(--green);color:#fff}
button[aria-pressed="true"]{border-color:var(--green);color:#fff}
button:focus-visible{outline:2px solid var(--green);outline-offset:2px}
</style>
</head><body>
<div class="stage" id="stage">
  <canvas id="c" aria-label="Short vertical en pixel art: los dos caminan y corren juntos contra la figura de capa, que los despide de un giro"></canvas>
  <div class="hook" id="hook"></div>
  <div class="sub" id="sub"></div>
</div>
<div class="controls">
  <button id="sound" type="button" aria-pressed="false">♪ ACTIVAR SONIDO</button>
  <button id="toggle" type="button">❚❚ PAUSA</button>
</div>
<script src="../../engine/sakuga.js"></script>
<script>
(()=>{
const S=window.Sakuga,{P,lerp,ease,easeIn,easeOut,clamp,segAt,lerpPose,rotPt,worldPt,gait,q8,q12}=S;
const LOOP=9.6;

// ---------- personajes ----------
const BLUE={head:'hood',
  pal:{coat:'#232a5c',coatD:'#161a3c',pants:'#1a1d3a',pantsD:'#13152c',boot:'#0c0d1c',skin:'#f0c4a0',glove:'#d8e8ff',hood:'#1b2350',hair:'#2a3060',tip:'#4fb4ff',aura:'#4fb4ff',dark:'#1f5fa8'},
  chains:[
    {key:'coat',anchor:'hip',off:[-4,2],n:3,len:9,w:[8,5],col:'coat',grav:1.2,wind:.8},
    {key:'braid',anchor:'head',off:[-7,-2],n:7,len:6,w:[3,2],col:'hair',tip:'tip',tipFrom:5,grav:1,damp:.9,when:c=>c.hoodDown}
  ]};
const RED={head:'hair',
  pal:{coat:'#4a1222',coatD:'#2c0a14',pants:'#261018',pantsD:'#1c0810',boot:'#120508',skin:'#e0b090',glove:'#e0b090',hair:'#15060c',tip:'#c41a34',scarf:'#d81e3a',aura:'#ff2e45',dark:'#8a1024'},
  chains:[
    {key:'coat',anchor:'hip',off:[-4,2],n:3,len:9,w:[8,5],col:'coat',grav:1.2,wind:.8},
    {key:'scarf',anchor:'chest',off:[-2,-3],n:7,len:8,w:[4,2],col:'scarf',grav:.9,damp:.88},
    {key:'pony',anchor:'head',off:[-6,-6],n:6,len:7,w:[5,1.5],col:'hair',tip:'tip',tipFrom:4,grav:1,damp:.9}
  ]};
const GREEN={head:'hood',
  pal:{coat:'#14382a',coatD:'#0c2419',pants:'#0e2a1e',pantsD:'#0a1f16',boot:'#06120c',skin:'#0b1712',neck:'#0b1712',glove:'#9affc4',hood:'#14382a',hair:'#14382a',aura:'#5bff9e',dark:'#0f6a3a'},
  chains:[{key:'cape',anchor:'chest',off:[-3,-2],n:7,len:9,w:[13,7],col:'coatD',grav:1.3,wind:.55,damp:.92}]};

// ---------- coreografía ----------
// O pies de él en el charco · W caminan juntos (pies clavados) · R corren · K1 ella salta desde las manos de él · K2 picada + barrida
// H hit-stop · C impact · X él gira y los despide · S "Todavía no", se va caminando · Z la cámara baja a sus pies · E mismos pies (= cuadro 0)
const T={walk:1.0,run:3.0,boost:3.6,dive:3.95,hit:4.25,imp:4.33,spin:4.7,land:5.2,talk:5.7,leave:6.4,down:7.6,close:8.4};
const GX=60,WALK=45,RUN=140;
const FINAL=gait(15,{x0:GX,dir:1,stride:18,lift:4,bob:.6});
const finalGreen=()=>({id:'green',pose:lerpPose(P.walkA,P.walkB,FINAL.swing),dir:1,x:FINAL.x,y:FINAL.y,plant:{lF:FINAL.l,rF:FINAL.r}});
const BLOCK=rotPt({dir:-1},P.upper.rH),CONTACT=[GX+BLOCK[0],BLOCK[1]-2];
const DIVE={dir:1,rot:.9};const RED_AT=(()=>{const[fx,fy]=rotPt(DIVE,P.strike.rH);return[CONTACT[0]-fx,CONTACT[1]-fy]})();
const APEX=[RED_AT[0]-30,-150];
function state(t){
  const t12=q12(t),sg=(a,c)=>segAt(t,a,c),sg12=(a,c)=>segAt(t12,a,c);
  const breath=o=>Math.floor(q8(t)*2.67+o)%2?P.stance2:P.stance;
  const s={phase:'O',cam:{zoom:4.2,camX:FINAL.x,camY:-7},chars:[finalGreen()]};
  if(t<T.walk)return s;
  if(t>=T.close){s.phase='E';return s}
  const red={id:'red',dir:1},blue={id:'blue',dir:1,hoodDown:true},green={id:'green',pose:breath(0),dir:-1,x:GX};
  s.chars=[blue,red,green];
  if(t<T.run){s.phase='W';const d=(t12-T.walk)*WALK;
    for(const[c,x0]of[[red,-150],[blue,-178]]){const g=gait(d,{x0,stride:24,lift:5,bob:1.2});c.x=g.x;c.y=g.y;c.plant={lF:g.l,rF:g.r};c.pose=lerpPose(P.walkA,P.walkB,g.swing)}
    s.cam={zoom:1.2,camX:red.x+18,camY:-52}}
  else if(t<T.boost){s.phase='R';const d=(t12-T.run)*RUN;
    for(const[c,x0]of[[red,-60],[blue,-80]]){const g=gait(d,{x0,stride:40,lift:11,lead:.35,bob:2.5});c.x=g.x;c.y=g.y;c.plant={lF:g.l,rF:g.r};c.pose=lerpPose(P.runA,P.runB,g.swing)}
    s.cam={zoom:1.45,camX:red.x+20,camY:-55,rot:-.04}}
  else if(t<T.hit){
    blue.x=10;
    if(t<T.dive){s.phase='K1';const k=sg12(T.boost,T.dive);blue.pose=lerpPose(P.crouch,P.upper,clamp(k*3));
      red.x=lerp(24,APEX[0],k);red.y=lerp(0,APEX[1],easeOut(k));red.pose=P.tuck;red.rot=-Math.PI*2*k;
      s.cam={zoom:1.15,camX:30,camY:lerp(-80,-110,k)}}
    else{s.phase='K2';const k=sg12(T.dive,T.hit);red.pose=P.strike;red.dir=1;red.rot=DIVE.rot;red.x=lerp(APEX[0],RED_AT[0],k*k);red.y=lerp(APEX[1],RED_AT[1],k*k);
      red.ghosts=[1,2,3].map(i=>{const kk=clamp(k-i/12/(T.hit-T.dive));return[lerp(APEX[0],RED_AT[0],kk*kk),lerp(APEX[1],RED_AT[1],kk*kk)]});
      blue.pose=lerpPose(P.crouch,P.sweep,clamp(k*2));blue.x=lerp(10,16,k);green.pose=lerpPose(P.stance,P.upper,clamp(k*2));
      s.cam={zoom:1.25,camX:40,camY:-85}}
  }
  else if(t<T.spin){red.pose=P.strike;red.rot=DIVE.rot;red.x=RED_AT[0];red.y=RED_AT[1];blue.pose=P.sweep;blue.x=16;green.pose=P.upper;
    if(t<T.imp){s.phase='H';s.freeze=T.hit-.01;s.cam={zoom:1.4,camX:40,camY:-72}}else{s.phase='C';s.cam={zoom:1.4,camX:40,camY:-72,shake:6}}}
  else if(t<T.talk){
    // giro: se espeja cada 2 cuadros (truco clásico del anime) y la onda los despide
    s.phase='X';const ks=sg12(T.spin,T.spin+.3);
    green.pose=ks<1?P.kick:lerpPose(P.kick,breath(0),ease(sg12(T.spin+.3,T.spin+.6)));green.dir=ks<1?(Math.floor((t12-T.spin)*12/2)%2?1:-1):-1;
    const kr=sg12(T.spin,T.land);
    red.x=lerp(RED_AT[0],-84,easeOut(kr));red.y=t<T.land?lerp(RED_AT[1],0,kr)-Math.sin(Math.PI*kr)*40:0;red.rot=t<T.land?-Math.PI*3*kr:0;red.pose=t<T.land?P.tuck:P.after;
    blue.x=lerp(16,-44,easeOut(sg12(T.spin,T.spin+.55)));blue.pose=P.after;blue.skid=1-sg12(T.spin,T.spin+.55);
    s.cam={zoom:lerp(1.3,1.0,ease(sg(T.spin,T.spin+.4))),camX:lerp(40,10,ease(sg(T.spin,T.spin+.4))),camY:-70,shake:t<T.spin+.3?6:0};
  }
  else{
    red.x=-84;red.pose=P.after;blue.x=-44;blue.pose=P.after;red.y=blue.y=Math.floor(q8(t)*2.67)%2?-1:0; // jadean
    if(t<T.leave){s.phase='S';s.cam={zoom:1.0,camX:10,camY:-70}}
    else if(t<T.down){s.phase='S';const d=15*ease(sg12(T.leave,T.down-.15)),g=gait(d,{x0:GX,dir:1,stride:18,lift:4,bob:.6});
      green.dir=1;green.x=g.x;green.y=g.y;green.plant={lF:g.l,rF:g.r};green.pose=lerpPose(P.walkA,P.walkB,g.swing);s.cam={zoom:1.0,camX:lerp(10,30,sg(T.leave,T.down)),camY:-70}}
    else{s.phase='Z';Object.assign(green,finalGreen());const k=ease(sg(T.down,T.close));s.cam={zoom:lerp(1,4.2,k),camX:lerp(30,FINAL.x,k),camY:lerp(-70,-7,k)}}
  }
  return s;
}
const wind=t=>[-(220+150*Math.sin(t*1.3)),-50];

// ---------- dibujo ----------
function roof(s){
  const{toPx,wrect,R,ditherFill,hash}=S;
  for(let i=-14;i<15;i++){const w=30+hash(i)*40,h=20+hash(i+50)*60,x=i*50-s.cam.camX*.4;wrect(x,-h+30,w,h+400,'#0d0817');
    for(let j=0;j<5;j++)if(hash(i*13+j)>.4){const wx=x+4+hash(i*7+j)*(w-8),wy=-h+36+hash(i*3+j)*60;wrect(wx,wy,2.5,2.5,hash(i+j)>.6?'#ffb070':'#7080ff')}}
  wrect(-2,-262,4,222,'#0a0611');wrect(-16,-222,32,3,'#0a0611');if(Math.floor(S.t*2)%2)wrect(-3,-232,6,5,'#ff2e45');
  const[x0,gy]=toPx(-240,0),[x1]=toPx(200,0);
  R(x0,gy,x1-x0,S.PH,'#160f20');ditherFill(.5,'#0a0710',Math.max(0,Math.round(x0)),gy+Math.round((S.PH-gy)*.35),Math.min(S.PW,Math.round(x1)),S.PH);
  R(x0,gy,x1-x0,1,'#7a1830');
  // charcos con ondas de lluvia; el período divide al loop, así las ondas también cierran
  const per=LOOP/12;
  for(let i=0;i<9;i++){const px0=-200+i*48+S.hash(i)*20,[px,py]=toPx(px0,3+S.hash(i+3)*6);R(px-5*S.cam.k,py,14*S.cam.k,1,'#3a1830');R(px,py,4*S.cam.k,1,'#d8243a');
    const r=((S.t+S.hash(i+9)*per)%per)/per;S.ring(px,py,r*9*S.cam.k,r*2*S.cam.k,r<.5?'#8a80a8':'#3a3458')}
}
function ghostsOf(ch,cols){if(!ch.ghosts)return;[2,1,0].forEach(i=>S.figure({...ch,x:ch.ghosts[i][0],y:ch.ghosts[i][1]},'ink',cols[i]))}

function render(s){
  const{toPx,figure,ditherFill,disc,ring,seg}=S,t=S.t;
  const by=Object.fromEntries(s.chars.map(c=>[c.id,c]));
  if(s.phase==='C'){S.impact(T.imp,CONTACT[0],CONTACT[1],s.chars,'受');return}
  S.sky(['#04030a','#08061a','#0e0a24','#1a0c26','#2a1024'],{x:S.PW*.75-s.cam.camX*.02,y:toPx(0,-330)[1]*.3+S.PH*.08,r:S.PW*.16});
  roof(s);
  const red=by.red,blue=by.blue,green=by.green;
  for(const c of s.chars)if(!c.ghosts||true)S.shadow(c);
  const calm=s.phase==='O'||s.phase==='E'||s.phase==='S'||s.phase==='Z';
  if(red)S.aura(red.x,-50+(red.y||0),RED.pal,calm?.25:.7);if(blue)S.aura(blue.x,-50,BLUE.pal,calm?.25:.7);
  S.aura(green.x,-50,GREEN.pal,s.phase==='X'||s.phase==='H'?1:.35);
  if(s.phase==='X'){const k=seg(T.spin,T.spin+.6),[cx,cy]=toPx(GX,-50);ring(cx,cy,k*120*S.cam.k,k*40*S.cam.k,'#d0ffe4');ring(cx,cy,k*90*S.cam.k,k*30*S.cam.k,'#5bff9e')}
  if(red)ghostsOf(red,['#ff2e45','#8a1024','#40081a']);
  if(blue)figure(blue,'glow');if(red)figure(red,'glow');figure(green,'glow');
  if(blue&&blue.skid>0)S.skidSparks(blue.x-8,1,blue.skid,9);
  if(s.phase==='R')S.speedLines(0,26);
  if(s.phase==='K2'||s.phase==='H')S.speedLines(Math.PI/2-.9,22);
  if(s.phase==='H'){const[cx,cy]=toPx(...CONTACT);disc(cx,cy,6*S.cam.k,'#ffffff');ring(cx,cy,10*S.cam.k,10*S.cam.k,'#ffffff');
    const[fx,fy]=toPx(GX-12,-4);disc(fx,fy,4*S.cam.k,'#ffffff')}
  if(s.phase==='X'&&t<T.spin+.3)S.focusLines('#d0ffe4',30,2,24,...toPx(GX,-50));
  if(s.phase==='X')ditherFill(1-seg(T.spin,T.spin+.25),'#d0ffe4');
}
function post(s){if(s.phase!=='C')S.rain(.35)}

// ---------- sonido ----------
const X=S.sfx;
const step=()=>S.noise(.06,'lowpass',700,200,.35);
const sfx=[
  [.12,()=>S.noise(.5,'highpass',2000,6000,.12,1,true)],
  ...[0,1,2,3,4,5,6,7].map(i=>[T.walk+.13+i*.27,step]),
  [T.run,()=>X.whoosh(.25)],
  ...[0,1,2].map(i=>[T.run+.1+i*.15,step]),
  [T.boost,()=>{X.whoosh(.3);step()}],
  [T.dive,()=>X.rise(.25)],
  [T.imp,X.boom],
  [T.spin,()=>{X.swish();X.bigBoom()}],
  [T.spin+.05,()=>X.scrape(.5)],
  [T.land,X.thud],
  [T.talk,X.heartbeat],
  ...[0,1,2].map(i=>[T.leave+.2+i*.4,step]),
  [T.down,()=>S.noise(.6,'lowpass',200,1200,.2,1,true)]
];
const drone=s=>({O:.03,W:.08,R:.2,K1:.25,K2:.3,H:0,C:0,X:.2,S:.06,Z:.05,E:.03}[s.phase]??0);
const ambience=s=>{const hush=s.freeze!=null||s.phase==='C';return{rain:hush?0:.06,wind:hush?0:.03,windFreq:320}};

S.start({
  loop:LOOP,vertical:true,camCy:.5,reducedT:3.3,
  chars:{blue:BLUE,red:RED,green:GREEN},
  light:{x:200,rim:'#ff5a6a'},
  state,wind,render,post,sfx,drone,ambience,
  subs:[[T.talk,T.leave+.3,'—Todavía no.','まだだ']],
  hook:[[0,1.0,'2 CONTRA 1','二対一']],
  el:{stage:document.getElementById('stage'),canvas:document.getElementById('c'),toggle:document.getElementById('toggle'),
      sound:document.getElementById('sound'),sub:document.getElementById('sub'),hook:document.getElementById('hook')}
});
})();
</script>
</body></html>
