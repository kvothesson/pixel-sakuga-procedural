<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Máxima 10 · Episodio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
/* Layout: episodio vertical 9:16 centrado; los diálogos son globos de texto encima del cuadro; controles debajo. Look fijo (single-theme a propósito). */
:root{
  --night:#0d0a14;
  --ink:#ece8f6;
  --dim:#8a83a6;
  --pasto:#4a9a3c;
  --globo:#ffffff;
  --globo-tinta:#141418;
  --wa:#dcf8c6;
  --radio:#1c2440;
  --f-pixel:"DotGothic16","MS Gothic",ui-monospace,monospace;
  color-scheme:dark;
}
html,body{background:var(--night);color:var(--ink);margin:0}
body{font-family:var(--f-pixel);padding-inline:16px;padding-block:16px 24px;display:flex;flex-direction:column;align-items:center;gap:12px}
.stage{position:relative;width:min(100%,calc(82vh * 9 / 16));aspect-ratio:9/16;max-width:100%;overflow:hidden;background:#000;cursor:pointer;border-radius:10px;box-shadow:0 0 0 2px #23401c;container-type:inline-size}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated}
#bubbles{position:absolute;inset:0;pointer-events:none}
.bub{position:absolute;max-width:66%;padding:.35em .6em;background:var(--globo);color:var(--globo-tinta);border:2px solid var(--globo-tinta);border-radius:.7em;
  font-size:clamp(12px,4.6cqw,19px);line-height:1.2;box-shadow:3px 3px 0 rgba(0,0,0,.45)}
.bub small{display:block;font-size:.68em;opacity:.7;letter-spacing:.04em}
.chat{position:absolute;left:5%;right:22%;top:8%;display:flex;flex-direction:column;gap:.4em;align-items:flex-start}
.chat .bub{position:static;max-width:100%}
.bub.wa{background:var(--wa);border-radius:.5em .5em .5em 0}
.bub.wa.big{font-size:clamp(15px,6cqw,26px)}
.bub.radio{background:var(--radio);color:#fff;border-color:#000}
.bub.big{font-size:clamp(18px,8cqw,34px);padding:.25em .5em}
.bub.l{border-bottom-left-radius:0}
.bub.r{border-bottom-right-radius:0}
.title{position:absolute;left:0;right:0;top:9%;text-align:center;font-size:clamp(14px,6cqw,26px);color:#fff;text-shadow:2px 0 #000,-2px 0 #000,0 2px #000,0 -2px #000;letter-spacing:.08em}
.title small{display:block;font-size:.55em;color:#ffd84a}
.hook,.sub{display:none}
.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;color:var(--dim);font-size:14px}
button{font:inherit;color:var(--ink);background:#141020;border:2px solid #34404a;padding:6px 14px;cursor:pointer;letter-spacing:.06em}
button:hover{border-color:var(--pasto);color:#fff}
button[aria-pressed="true"]{border-color:var(--pasto);color:#fff}
button:focus-visible{outline:2px solid var(--pasto);outline-offset:2px}
</style>
</head><body>
<div class="stage" id="stage">
  <canvas id="c" aria-label="Episodio en pixel art, planos fijos en un country: la garita, la calle con máxima 10, el grupo de WhatsApp, las señoras que caminan, el pádel y el asado; un carpincho cruza todo y el guardia lo persigue a paso de hombre"></canvas>
  <div id="bubbles" aria-live="polite"></div>
  <div class="hook" id="hook"></div>
  <div class="sub" id="sub"></div>
</div>
<div class="controls">
  <button id="sound" type="button" aria-pressed="false">♪ ACTIVAR SONIDO</button>
  <button id="toggle" type="button">❚❚ PAUSA</button>
</div>
<script src="../../engine/sakuga.js"></script>
<script src="../../engine/produccion.js"></script>
<script>
(()=>{
const S=window.Sakuga,{P,lerp,ease,easeIn,easeOut,clamp,segAt,lerpPose,worldPt,q8,q12,q24,hash}=S;

// ================= personajes (se ven de lejos: silueta y color) =================
const pal=(coat,coatD,pants,pantsD,hair,skin='#d0a07a',boot='#1a1a1a')=>({coat,coatD,pants,pantsD,boot,skin,neck:skin,glove:skin,hair,aura:'#fff',dark:'#333'});
const CHARS={
  guard:{head:'hair',pal:pal('#5a78b4','#3e5688','#232a3e','#1a2030','#2a1e16')},
  patrol:{head:'hair',pal:pal('#d8e030','#a8b020','#2a2e3a','#1e222c','#7a7a7a','#c48a62')}, // otro personaje: chaleco flúor, canoso
  kid:{head:'hair',pal:pal('#f2c218','#c89a10','#d4202c','#a01820','#5a3418','#e8b48a','#f4f4f4')},
  lady1:{head:'hair',pal:pal('#f08ab4','#c4648c','#1a1a22','#121218','#d8b070','#e8c0a0','#f4f4f4')},
  lady2:{head:'hair',pal:pal('#4ac8c0','#2e9890','#1a1a22','#121218','#3a2418','#c8956a','#f4f4f4')},
  lady3:{head:'hair',pal:pal('#b89af0','#8a6ac4','#1a1a22','#121218','#e8e0d0','#e8c0a0','#f4f4f4')},
  lady4:{head:'hair',pal:pal('#f4f4f0','#c8c8c4','#1a1a22','#121218','#8a5a30','#d8a880','#f4f4f4')},
  pad1:{head:'hair',pal:pal('#f4f4f0','#c8c8c4','#2a4a8a','#1e3668','#3a2a1a','#d8a880','#f4f4f4')},
  pad2:{head:'hair',pal:pal('#e85a2a','#b8401a','#f4f4f0','#c8c8c4','#141010','#c8956a','#f4f4f4')},
  parri:{head:'hair',pal:pal('#8a8a8a','#6a6a6a','#2a3a5a','#1e2c44','#d8d8d8','#d0a07a')},
  vecina:{head:'hair',pal:pal('#c42a6a','#8a1a4a','#1a1a22','#121218','#f2d070','#e8c0a0')},
};
const VISOR={lady1:'#ffffff',lady2:'#ff6aa8',lady3:'#ffd84a',lady4:'#4ac8c0'};
const SEAT={hip:[0,-40],chest:[2,-68],head:[4,-83],lE:[8,-56],lH:[20,-55],rE:[10,-56],rH:[21,-56],lK:[16,-42],lF:[20,-16],rK:[18,-42],rF:[22,-16]};
const RADIO={...SEAT,rE:[14,-68],rH:[9,-80]};
const BOOTH={...P.stance,lE:[10,-62],lH:[24,-66],rE:[14,-60],rH:[26,-62]};
const BOOTH_PHONE={...P.stance,rE:[14,-70],rH:[9,-82],lE:[6,-58],lH:[16,-56]};
const BENCH={hip:[0,-34],chest:[-6,-60],head:[-5,-75],lE:[-12,-46],lH:[-8,-34],rE:[2,-46],rH:[8,-36],lK:[16,-32],lF:[22,0],rK:[20,-32],rF:[26,0]};
const TABLE={hip:[0,-34],chest:[3,-62],head:[5,-77],lE:[12,-50],lH:[22,-52],rE:[13,-50],rH:[23,-53],lK:[16,-34],lF:[18,-6],rK:[18,-34],rF:[20,-6]};
const EAT={...TABLE,rE:[14,-58],rH:[11,-72]};
const RACKET_HIT={...P.strike,rE:[30,-80],rH:[44,-92]};

// ================= coreografía: seis planos fijos medidos en beats =================
const SEQ=S.sequence([
  {id:'garita',beats:28},{id:'maxima',beats:20},{id:'whatsapp',beats:16},
  {id:'senoras',beats:18},{id:'padel',beats:16},{id:'asado',beats:26},{id:'cierre',beats:4}
],{bpm:120});
const LOOP=SEQ.total,ST=id=>SEQ.start(id);
// hit-stops (tiempo local de cada plano)
const HIT={padel:[4.4,.12],whatsapp:[5.6,.1]};
function state(t){
  const s=SEQ.state(t),h=HIT[s.shot.id];s.cam={zoom:.85,shake:0};
  if(h&&s.lt>=h[0]&&s.lt<h[0]+h[1])s.freeze=t-s.lt+h[0];
  const shk={padel:[4.52,5.0,4],whatsapp:[5.7,6.3,5]}[s.shot.id];
  if(shk&&s.lt>=shk[0]&&s.lt<shk[1])s.cam.shake=shk[2]*(1-segAt(s.lt,shk[0],shk[1]));
  return s}

// ================= tres planos de profundidad con la cámara quieta =================
function plane(scale,groundFrac){const c=S.cam,k=S.u*.85*scale,cy=S.PH*.5;return{k,cx:c.cx,cy,camX:0,camY:-(S.PH*groundFrac-cy)/k,rot:0}}
function withCam(cam,fn){const keep=S.cam;S.cam=cam;fn();S.cam=keep}
function figAt(ch,scale,mode='plain',ink){if(scale===1){S.figure(ch,mode,ink);return}const c=S.cam,[X,Y]=S.toPx(ch.x,ch.y||0),k=c.k*scale;
  withCam({...c,k,camX:ch.x-(X-c.cx)/k,camY:(ch.y||0)-(Y-c.cy)/k},()=>S.figure(ch,mode,ink))}
const FAR=()=>plane(.38,.46),MID=()=>plane(.78,.62),NEAR=()=>plane(1.1,.97);
// gorra o visera sobre la cabeza de una figura
function hat(ch,col,brim=5,lift=0){const k=S.cam.k,[hx,hy]=S.toPx(...worldPt(ch,ch.pose.head)),d=ch.dir||1;
  S.R(hx-5*k,hy-11*k-lift*k,11*k,4*k,col);S.R(d>0?hx+4*k:hx-(4+brim)*k,hy-8*k-lift*k,brim*k,2*k,col)}

// ================= fondos =================
const SKIES={
  tarde:['#3a3a7a','#5a5a9a','#8a7ab0','#d89a8a','#f4c088','#f8dca0'],
  atardecer:['#2c1d4c','#4a2458','#7e3060','#c4505a','#ec7a48','#f6b25e'],
  noche:['#04030c','#080820','#0e0e2c','#161636','#1e1a40','#28204a'],
  manana:['#6aa8e0','#84bae8','#a0ccee','#bcdcf0','#d8eaf0','#f4ecd8'],
  mediodia:['#3a88d8','#4a94dc','#5aa0e0','#6eaee6','#86bcea','#a8d0ee']};
function sky(name){const{R,PW,PH}=S,H=PH*.46,b=SKIES[name];
  b.forEach((c,i)=>{R(0,i*H/b.length,PW,H/b.length+1,c);if(i<b.length-1)S.ditherFill(.5,b[i+1],0,(i+1)*H/b.length-2,PW,(i+1)*H/b.length)});
  if(name==='noche'){for(let i=0;i<40;i++)S.R(hash(i)*PW,hash(i+40)*H*.8,1,1,hash(i+7)>.7?'#ffffff':'#8a88b8');S.disc(PW*.78,H*.25,PW*.06,'#f4f0dc');S.disc(PW*.8,H*.24,PW*.05,'#0e0e2c')}
  else if(name==='atardecer'||name==='tarde'){S.disc(PW*.24,H*.86,PW*.09,'#ffe0a0');S.disc(PW*.24,H*.86,PW*.07,'#fff2d0')}
  else S.disc(PW*.8,H*.18,PW*.06,'#fff8d8');
  if(name!=='noche')for(let i=0;i<4;i++){const x=((hash(i)*PW*1.4+S.t*PW*.02)%(PW*1.4))-PW*.2,y=H*(.2+hash(i+5)*.4);S.R(x,y,PW*(.12+hash(i+2)*.1),2,name==='atardecer'?'#f49a70':'#ffffff');S.R(x+4,y-1,PW*.08,1,name==='atardecer'?'#ffc898':'#f4f8ff')}}
function houses(night){const{toPx,poly,R}=S,k=S.cam.k;
  for(let i=-9;i<10;i++){const x=i*120;
    const[a,g0]=toPx(x-40,0),[b]=toPx(x+40,0),[,wt]=toPx(0,-60),[ra]=toPx(x-48,0),[rb]=toPx(x+48,0),[rx,rt]=toPx(x,-100);
    poly([[ra,wt],[rb,wt],[rx,rt]],night?'#24223a':'#5a5868');R(a,wt,b-a,g0-wt,night?'#4a4660':'#ece6dc');
    const[wx,wy]=toPx(x-28,-44);R(wx,wy,24*k,20*k,night?(hash(i)>.4?'#ffcf7a':'#1a1830'):'#ffcf7a');const[dx,dy]=toPx(x+10,-40);R(dx,dy,14*k,40*k,'#6a4a32');
    const[tx,ty]=toPx(x+70,-46);S.disc(tx,ty,26*k,night?'#14281a':'#2a5a2c');S.disc(tx-6*k,ty-8*k,18*k,night?'#1c3420':'#3a7034');R(tx-2*k,ty+20*k,4*k,26*k,'#4a3020')}
  const[,gy]=toPx(0,0);R(0,gy-3*k*6,S.PW,3*k*6,night?'#14301a':'#2f6a2a')}
function grassBand(night){const top=Math.round(S.PH*.46);S.R(0,top,S.PW,S.PH-top,night?'#1a3a1c':'#4e9440');for(let x=0;x<S.PW;x+=6)S.R(x,top+((x*7)%5),1,2,night?'#14301a':'#3c7c34')}
function street(night,bump=true){const{R}=S,k=S.cam.k,[,gy]=S.toPx(0,0),top=gy-44*k,bot=gy+46*k;
  R(0,top,S.PW,bot-top,night?'#2a2834':'#55525e');R(0,top,S.PW,1,'#d8d4cc');R(0,bot,S.PW,2,'#d8d4cc');
  if(bump){const[bx]=S.toPx(0,0);for(let y=top+1;y<bot;y++){const w=(7*k+(y-top)*.12);for(let x=-w;x<w;x+=Math.max(2,3*k))R(bx+x,y,Math.max(1,1.5*k),1,((x/Math.max(2,3*k))|0)%2?'#f2c218':'#1a1a1a')}}
  return{top,bot}}
function lawnNear(night){const top0=Math.round(S.PH*.62+20);S.R(0,top0,S.PW,S.PH-top0,night?'#1a3a1c':'#4a9a3c');const bw=Math.max(6,Math.round(S.PW/9));
  for(let y=top0;y<S.PH;y++){const off=Math.round((y-top0)*.7)%(2*bw);for(let x=-2*bw+off;x<S.PW;x+=2*bw)S.R(x,y,bw,1,night?'#20441f':'#58aa48')}}
function tufts(g){const f=Math.floor(S.t*12);for(let i=0;i<26;i++){const[x,y]=S.toPx(-120+hash(i)*240,-110+hash(i+9)*230),k=S.cam.k,lean=g*7+Math.sin(f*.7+i)*.6;
  S.line(x,y,x+lean*k,y-6*k,1,'#2f7a2a');S.line(x+2,y,x+2+lean*k*.8,y-4*k,1,'#68b858')}}
function sprinkler(xw,yw,g){const[x,y]=S.toPx(xw,yw),k=S.cam.k;S.R(x-2,y-2,4,3,'#2a2a2a');const base=(S.t*Math.PI*2/2)%(Math.PI*2);
  for(let i=0;i<14;i++){const a=-Math.PI*.15-((base+i*.22)%Math.PI)*.7,d=(14+i*4)*k;S.R(x+Math.cos(a)*d+g*i*3*k,y+Math.sin(a)*d*.8+(i*i*.12)*k,1,1,i%3?'#bfe8ff':'#ffffff')}}
function speedSign(xw,rot){const k=S.cam.k,[px,py]=S.toPx(xw,40),[sx,sy]=S.toPx(xw,-75),r=26*k,cs=Math.cos(rot),hw=Math.abs(cs);
  S.line(px,py,sx,sy,Math.max(2,3*k),'#1a1a1e');S.line(px+1,py,sx+1,sy,1,'#8a8a96');
  for(let dy=-r-1;dy<=r+1;dy++){const w=Math.sqrt(Math.max(0,(r+1)**2-dy*dy))*hw;S.R(sx-w-1,sy+dy,2*w+2,1,'#1a1a1e')}
  for(let dy=-r;dy<=r;dy++){const w=Math.sqrt(Math.max(0,r*r-dy*dy))*hw,inner=Math.sqrt(Math.max(0,(r*.74)**2-dy*dy))*hw;
    if(cs<0){S.R(sx-w,sy+dy,2*w,1,dy<0?'#a8a8b0':'#8a8a94');continue}S.R(sx-w,sy+dy,2*w,1,'#d4202c');if(inner>0)S.R(sx-inner,sy+dy,2*inner,1,'#f6f4ee')}
  if(cs>.82)S.pixText('10',sx,sy+1,r*1.15,'#141414')}

// ================= el carrito de seguridad (de perfil, mirando a la derecha) =================
function cart(x,y0,lift,{pose=SEAT,cap=null,empty=false}={}){const k=S.cam.k;
  const p=(dx,dy)=>S.toPx(x+dx,y0+lift+dy),flash=Math.floor(S.t*6)%2,P_=pts=>pts.map(([a,b])=>p(a,b));
  const shape=(pts,col)=>{const q=P_(pts);for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]])S.poly(q.map(([a,b])=>[a+dx,b+dy]),'#141418');S.poly(q,col)};
  const post=(a,b,c,d)=>{const[x1,y1]=p(a,b),[x2,y2]=p(c,d);S.line(x1,y1,x2,y2,Math.max(2,3*k)+1,'#141418');S.line(x1,y1,x2,y2,Math.max(1,3*k),'#e4e4ea')};
  post(-58,-46,-58,-124);
  shape([[-66,-14],[-30,-14],[-30,-50],[-60,-50],[-66,-42]],'#eeeef2');
  shape([[-36,-80],[-28,-80],[-26,-46],[-34,-46]],'#26262c');
  if(!empty){const guard={id:'patrol',pose,dir:1,x:x-12,y:y0+lift-10};S.figure(guard,'plain');
    const h=S.toPx(...worldPt(guard,guard.pose.head)),c=cap?cap(h):h;S.R(c[0]-5*k,c[1]-11*k,11*k,4*k,'#f0f0f0');S.R(c[0]+4*k,c[1]-8*k,5*k,2*k,'#f0f0f0')}
  shape([[-32,-14],[16,-14],[16,-40],[-32,-40]],'#eeeef2');S.poly(P_([[-32,-46],[14,-46],[14,-40],[-32,-40]]),'#26262c');
  shape([[14,-14],[66,-14],[68,-28],[58,-44],[32,-50],[14,-42]],'#eeeef2');S.poly(P_([[-64,-28],[66,-28],[66.5,-24],[-64,-24]]),'#2a5ab4');
  {const[hx,hy]=p(64,-34);S.R(hx-2*k,hy,3*k,3*k,'#fff6b0')}
  {const[a,b]=p(26,-48),[c,d]=p(14,-64);S.line(a,b,c,d,Math.max(1,2*k),'#26262c');S.R(c-4*k,d-1,8*k,Math.max(1,2*k),'#26262c')}
  post(34,-50,44,-124);{const[a,b]=p(36,-56),[c,d]=p(43,-118);S.line(a+2,b,c+2,d,1,'#9ad0f0')}
  shape([[-66,-130],[52,-130],[52,-123],[-66,-123]],'#eeeef2');
  {const[bx,by]=p(-6,-136),col=flash?'#ff3040':'#3a70ff';S.R(bx-7*k,by,14*k,5*k,col);S.ditherDisc(bx,by+2*k,18*k,col,.4)}
  for(const wx of[-40,40]){const[cx,cy]=p(wx,-10);S.disc(cx,cy,10*k+1,'#0a0a0c');S.disc(cx,cy,5*k,'#9a9aa6')}}

// ================= el carpincho: galope, paso, nado y sentado a la mesa =================
function capybara(t,x,y0,{mode='gallop',dir=1,ink=null}={}){const k=S.cam.k,f=Math.floor(t*24),col=c=>ink||c;
  const p=(dx,dy)=>S.toPx(x+dir*dx,y0+dy),O='#140c08',B='#8a5c36',D='#6e4628';
  const ell=(cx,cy,rx,ry,c,n=20)=>{const pts=[];for(let i=0;i<n;i++){const a=i/n*Math.PI*2;pts.push(p(cx+Math.cos(a)*rx,cy+Math.sin(a)*ry))}S.poly(pts.map(([a,b])=>{const[c0,c1]=p(cx,cy);return[a+Math.sign(a-c0),b+Math.sign(b-c1)]}),col(O));S.poly(pts,col(c))};
  const head=(hx,hy)=>{const H=[[0,-12],[26,-10],[28,4],[4,10]].map(([a,b])=>p(hx+a,hy+b));S.poly(H.map(([a,b])=>[a+1,b+1]),col(O));S.poly(H,col(B));
    if(!ink){const[ex,ey]=p(hx+16,hy-6);S.R(ex,ey,Math.max(1,3*k),1,O);const[nx,ny]=p(hx+24,hy-5);S.R(nx,ny,Math.max(1,2*k),Math.max(1,2*k),'#2a1a10');const[ax,ay]=p(hx+3,hy-14);S.R(ax,ay,Math.max(1,3*k),Math.max(1,3*k),D)}};
  const leg=(a,b,c,d)=>{const[x1,y1]=p(a,b),[x2,y2]=p(c,d);S.line(x1,y1,x2,y2,Math.max(2,6*k),col(O));S.line(x1,y1,x2,y2,Math.max(1,4*k),col('#5a3a20'))};
  if(mode==='gallop'){const ph=f%2;for(const L of(ph?[[-26,-10,-40,0],[-18,-10,-30,0],[18,-10,34,0],[24,-10,40,0]]:[[-24,-10,-16,-2],[-18,-10,-10,-2],[18,-10,10,-2],[24,-10,16,-2]]))leg(...L);ell(0,-24,36,15,B);head(26,-26)}
  else if(mode==='walk'){const ph=Math.floor(t*6)%2,s=ph?4:-4;for(const[a,o]of[[-22,s],[-14,-s],[16,-s],[24,s]])leg(a,-10,a+o,0);ell(0,-24,36,15,B);head(26,-26)}
  else if(mode==='swim'){ell(0,-2,34,9,B);head(26,-6);if(!ink){const[a,b]=p(-34,0),[c,d]=p(-90,-8),[e,g]=p(-90,8);S.line(a,b,c,d,1,'#e8f4ff');S.line(a,b,e,g,1,'#e8f4ff')}}
  else if(mode==='sit'){ell(0,-30,17,28,B);head(4,-66);
    // patitas adelante sosteniendo el choripán a la altura de la boca
    const[ax,ay]=p(14,-44),[bx,by]=p(24,-52);S.line(ax,ay,bx,by,Math.max(2,5*k),col(O));S.line(ax,ay,bx,by,Math.max(1,3*k),col('#5a3a20'));

    // mantel a cuadros: tapa las piernas de todos
    const[ta,tt]=toPx(-108,-42),[tb]=toPx(60,-42),[,tb2]=toPx(0,-8),sq=Math.max(2,Math.round(4*k));

    const pr={id:'parri',pose,dir,x:px,y:10};S.figure(pr,'plain');{const[hx,hy]=toPx(...worldPt(pr,pose.head));S.R(hx-5*k,hy-14*k,10*k,7*k,'#ffffff')}

    // el guardia llega en el carrito por adelante, se baja, mira y se sienta
    const cx=lt<AS.cart0?null:lt<AS.stop?lerp(-260,-150,easeOut((lt-AS.cart0)/(AS.stop-AS.cart0))):-150;
    if(cx!=null)cart(cx,40,0,{empty:lt>=AS.out});noFeedSign(-20,96);

}

  // carpincho chiquito comiendo, tachado
  const r=w*.4;S.disc(sx,sy,r,'#d4202c');S.disc(sx,sy,r-3*k,'#ffffff');

function cumbia(prev,cur){const st=60/SEQ.bpm/4,a=Math.floor(prev/st),b=Math.floor(cur/st);if(b===a||b<a)return;
  for(let step=a+1;step<=b;step++){const tt=step*st;if(SEQ.at(((tt%LOOP)+LOOP)%LOOP).id!=='asado')continue;const pos=step%16,bar=Math.floor(step/16)%2;
