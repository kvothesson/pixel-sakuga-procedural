<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Otra Vez · Ep. 4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
/* Layout: short vertical 9:16 centrado, gancho arriba, subtítulos abajo, controles debajo. Look nocturno fijo (single-theme a propósito). */
:root{
  --night:#07050d;
  --ink:#ece8f6;
  --dim:#8a83a6;
  --blue:#4fb4ff;
  --red:#ff2e45;
  --green:#5bff9e;
  --f-pixel:"DotGothic16","MS Gothic",ui-monospace,monospace;
  color-scheme:dark;
}
html,body{background:var(--night);color:var(--ink);margin:0}
body{font-family:var(--f-pixel);padding-inline:16px;padding-block:16px 24px;display:flex;flex-direction:column;align-items:center;gap:12px}
.stage{position:relative;width:min(100%,calc(82vh * 9 / 16));aspect-ratio:9/16;max-width:100%;overflow:hidden;background:#000;cursor:pointer;border-radius:10px;box-shadow:0 0 0 2px #10261c}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated}
.hook{position:absolute;top:13%;left:0;right:0;text-align:center;pointer-events:none;font-size:clamp(18px,6vw,30px);letter-spacing:.06em;color:#fff;
  text-shadow:3px 0 #0f6a3a,-3px 0 #000,0 3px #000,0 -3px #000}
.hook small{display:block;font-size:.5em;color:#ffd84a;letter-spacing:.2em;text-shadow:2px 0 #000,-2px 0 #000,0 2px #000}
.sub{position:absolute;left:50%;bottom:17%;transform:translateX(-50%);width:92%;text-align:center;pointer-events:none;
  font-size:clamp(18px,5.5vw,26px);color:#fff;text-shadow:2px 0 #000,-2px 0 #000,0 2px #000,0 -2px #000}
.sub small{display:block;font-size:.62em;color:#ffd84a;letter-spacing:.1em}
.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;color:var(--dim);font-size:14px}
button{font:inherit;color:var(--ink);background:#140d22;border:2px solid #3a2a5c;padding:6px 14px;cursor:pointer;letter-spacing:.06em}
button:hover{border-color:var(--green);color:#fff}
button[aria-pressed="true"]{border-color:var(--green);color:#fff}
button:focus-visible{outline:2px solid var(--green);outline-offset:2px}
</style>
</head><body>
<div class="stage" id="stage">
  <canvas id="c" aria-label="Short vertical en pixel art: la figura de capa salta desde la antena y frena a los dos a la vez"></canvas>
  <div class="hook" id="hook"></div>
  <div class="sub" id="sub"></div>
</div>
<div class="controls">
  <button id="sound" type="button" aria-pressed="false">♪ ACTIVAR SONIDO</button>
  <button id="toggle" type="button">❚❚ PAUSA</button>
</div>
<script src="../../engine/sakuga.js"></script>
<script>
(()=>{
const S=window.Sakuga,{P,lerp,ease,easeIn,easeOut,clamp,segAt,lerpPose,rotPt,worldPt,q8,q12}=S;
const LOOP=9.0;

// ---------- personajes ----------
const BLUE={head:'hood',
  pal:{coat:'#232a5c',coatD:'#161a3c',pants:'#1a1d3a',pantsD:'#13152c',boot:'#0c0d1c',skin:'#f0c4a0',glove:'#d8e8ff',hood:'#1b2350',hair:'#2a3060',tip:'#4fb4ff',aura:'#4fb4ff',dark:'#1f5fa8'},
  chains:[
    {key:'coat',anchor:'hip',off:[-6,-2],n:3,len:7.5,w:[9,14],col:'coatD',grav:1.3,wind:.8},
    {key:'braid',anchor:'head',off:[-7,-2],n:7,len:6,w:[3,2],col:'hair',tip:'tip',tipFrom:5,grav:1,damp:.9,when:c=>c.hoodDown}
  ]};
const RED={head:'hair',
  pal:{coat:'#4a1222',coatD:'#2c0a14',pants:'#261018',pantsD:'#1c0810',boot:'#120508',skin:'#e0b090',glove:'#e0b090',hair:'#15060c',tip:'#c41a34',scarf:'#d81e3a',aura:'#ff2e45',dark:'#8a1024'},
  chains:[
    {key:'coat',anchor:'hip',off:[-6,-2],n:3,len:7.5,w:[9,14],col:'coatD',grav:1.3,wind:.8},
    {key:'scarf',anchor:'chest',off:[-2,-3],n:7,len:8,w:[4,2],col:'scarf',grav:.9,damp:.88},
    {key:'pony',anchor:'head',off:[-6,-6],n:6,len:7,w:[5,1.5],col:'hair',tip:'tip',tipFrom:4,grav:1,damp:.9}
  ]};
const GREEN={head:'hood',
  pal:{coat:'#14382a',coatD:'#0c2419',pants:'#0e2a1e',pantsD:'#0a1f16',boot:'#06120c',skin:'#0b1712',neck:'#0b1712',glove:'#9affc4',hood:'#14382a',hair:'#14382a',aura:'#5bff9e',dark:'#0f6a3a'},
  chains:[{key:'cape',anchor:'chest',off:[-3,-2],n:7,len:9,w:[13,7],col:'coatD',grav:1.3,wind:.55,damp:.92}]};

// ---------- coreografía ----------
// O ojos verdes se abren · W lo miran desde abajo · J salta · L aterriza · R se levanta · B ambos atacan · H hit-stop · C impact
// D los frena a los dos · X onda que los despide · S se miran · Z empuje a su cara · E ojos verdes se cierran
const T={wide:.9,jump:1.6,land:2.25,ant:2.6,dash:2.9,hit:3.2,imp:3.3,hold:3.75,burst:4.6,stand:5.0,ask:5.35,ans:6.0,push:6.7,close:7.6};
const ANT_H=262,REACH=P.strike.rH[0];
function state(t){
  const t12=q12(t),sg=(a,c)=>segAt(t,a,c),sg12=(a,c)=>segAt(t12,a,c);
  const breath=o=>Math.floor(q8(t)*2.67+o)%2?P.stance2:P.stance;
  const red={id:'red',pose:breath(1),dir:1,x:-62},blue={id:'blue',pose:breath(0),dir:-1,x:62,hoodDown:true},green={id:'green',pose:P.crouch,dir:1,x:0,y:-ANT_H};
  const s={phase:'O',cam:{zoom:1.1,camX:0,camY:-70},chars:[]};
  if(t<T.wide)return s;
  if(t>=T.close){s.phase='E';return s}
  s.chars=[red,blue,green];
  if(t<T.jump){s.phase='W';s.cam={zoom:1,camY:lerp(-140,-170,ease(sg(T.wide,T.jump)))}}
  else if(t<T.land){s.phase='J';const k=sg12(T.jump,T.land);green.y=lerp(-ANT_H,0,k*k)-Math.sin(Math.PI*k)*40;green.pose=lerpPose(P.crouch,P.tuck,clamp(k*3));
    green.ghosts=[1,2,3].map(i=>{const kk=clamp(k-i/12/(T.land-T.jump));return[0,lerp(-ANT_H,0,kk*kk)-Math.sin(Math.PI*kk)*40]});
    s.cam={zoom:lerp(1,1.25,k),camY:lerp(-170,-80,ease(k))}}
  else if(t<T.dash){const k=sg12(T.land+.1,T.ant);green.y=0;green.pose=t<T.land+.1?P.land:lerpPose(P.land,P.stance,ease(k));
    s.phase=t<T.land+.08?'LH':'L';if(s.phase==='LH')s.freeze=T.land;
    if(t>=T.ant){const ka=ease(sg12(T.ant,T.ant+.17));red.pose=blue.pose=lerpPose(P.stance,P.crouch,ka)}
    s.cam={zoom:1.25,camY:-78,shake:t<T.land+.3?6:0}}
  else if(t<T.burst){
    green.y=0;
    if(t<T.hit){s.phase='B';const k=easeIn(sg12(T.dash,T.hit));red.x=lerp(-62,-29-REACH,k);blue.x=lerp(62,29+REACH,k);
      red.pose=blue.pose=lerpPose(P.crouch,P.strike,clamp(k*2));green.pose=lerpPose(P.stance,P.dualblock,clamp(k*1.4));
      red.ghosts=[1,2,3].map(i=>[lerp(-62,-29-REACH,easeIn(k-i*.25)),0]);blue.ghosts=red.ghosts.map(([x])=>[-x,0]);
      s.cam={zoom:lerp(1.25,1.15,k),camY:-74,shake:2}}
    else{red.x=-29-REACH;blue.x=29+REACH;red.pose=blue.pose=P.strike;green.pose=P.dualblock;
      if(t<T.imp){s.phase='H';s.freeze=T.hit-.01;s.cam={zoom:1.2,camY:-74}}
      else if(t<T.hold){s.phase='C';s.cam={zoom:1.2,camY:-74,shake:6}}
      else{s.phase='D';const k=sg(T.hold,T.burst),push=Math.round(Math.sin(t12*9)*2);red.x+=push-k*4;blue.x+=push+k*4;
        s.cam={zoom:lerp(1.2,1.05,k),camY:-74,shake:lerp(3,1,k),rot:Math.sin(t12*4)*.04}}}
  }
  else if(t<T.push){
    green.y=0;green.pose=t<T.burst+.15?P.dualblock:lerpPose(P.dualblock,breath(0),ease(sg12(T.burst+.15,T.burst+.5)));
    const kb=sg12(T.burst,T.burst+.55);red.x=lerp(-29-REACH,-96,easeOut(kb));blue.x=lerp(29+REACH,96,easeOut(kb));
    red.pose=blue.pose=t<T.stand+.2?P.after:lerpPose(P.after,P.stance,ease(sg12(T.stand+.2,T.stand+.5)));red.skid=blue.skid=1-kb;
    s.phase=t<T.stand?'X':'S';
    s.cam={zoom:lerp(1.05,.95,ease(sg(T.burst,T.stand))),camY:-70,shake:t<T.burst+.25?6:0};
  }
  else{s.phase='Z';red.x=-96;blue.x=96;green.y=0;green.pose=breath(0);
    const k=easeIn(sg(T.push,T.close)),[hx,hy]=rotPt(green,P.stance.head);
    s.cam={zoom:lerp(.95,7,k),camX:lerp(0,hx,ease(k*1.4)),camY:lerp(-70,hy,ease(k*1.4))}}
  return s;
}
const wind=t=>[-(260+180*Math.sin(t*1.3)),-50];

// ---------- dibujo ----------
const LOOK={frame:'#14382a',edge:'#5bff9e',rim:'#ff5a6a',iris:['#1fae5c','#8affb8'],bangs:false,flare:'#d0ffe4'};
function roof(s){
  const{toPx,wrect,R,ditherFill,hash}=S;
  for(let i=-12;i<13;i++){const w=30+hash(i)*40,h=20+hash(i+50)*60,x=i*50-s.cam.camX*.4;wrect(x,-h+30,w,h+400,'#0d0817');
    for(let j=0;j<5;j++)if(hash(i*13+j)>.4){const wx=x+4+hash(i*7+j)*(w-8),wy=-h+36+hash(i*3+j)*60;wrect(wx,wy,2.5,2.5,hash(i+j)>.6?'#ffb070':'#7080ff')}}
  wrect(-2,-ANT_H,4,ANT_H-40,'#0a0611');wrect(-16,-ANT_H+40,32,3,'#0a0611');wrect(-10,-ANT_H+90,20,3,'#0a0611');
  if(Math.floor(S.t*2)%2)wrect(-3,-ANT_H+30,6,5,'#ff2e45');
  const[x0,gy]=toPx(-170,0),[x1]=toPx(170,0);
  R(x0,gy,x1-x0,S.PH,'#160f20');ditherFill(.5,'#0a0710',Math.max(0,Math.round(x0)),gy+Math.round((S.PH-gy)*.35),Math.min(S.PW,Math.round(x1)),S.PH);
  R(x0,gy,x1-x0,1,'#7a1830');
  for(let i=0;i<4;i++){const[px,py]=toPx(-110+i*70,6+i*4);R(px,py,10*S.cam.k,1,'#5a1830');R(px+2*S.cam.k,py,4*S.cam.k,1,'#d8243a')}
}
function ghostsOf(ch,cols){if(!ch.ghosts)return;[2,1,0].forEach(i=>S.figure({...ch,x:ch.ghosts[i][0],y:ch.ghosts[i][1]},'ink',cols[i]))}
// cúpula verde: frena los dos golpes a la vez
function dome(k){const{toPx,ring,ditherDisc,line,disc,hash}=S,[cx,cy]=toPx(0,-74),K=S.cam.k,f=Math.floor(S.t*24);
  ditherDisc(cx,cy,(60+k*20)*K,'#0f6a3a',.75);
  for(let i=0;i<3;i++){const r=((S.t-T.hold)*110+i*40)%120;ring(cx,cy,r*K,r*K,i?'#5bff9e':'#d0ffe4')}
  for(const side of[-1,1]){const[px,py]=toPx(side*29,-76),col=side<0?'#ff2e45':'#4fb4ff';disc(px,py,(5+Math.sin(f)*1.5)*K,'#ffffff');
    for(let j=0;j<5;j++){const a=hash(f*7+j+side)*Math.PI*2,l=(12+hash(f+j)*22)*K;line(px,py,px+Math.cos(a)*l,py+Math.sin(a)*l,1,j%2?col:'#5bff9e')}}}
function landing(k){const{toPx,ring,ditherDisc}=S,[cx,cy]=toPx(0,0),K=S.cam.k;
  ring(cx,cy,(10+k*90)*K,(3+k*18)*K,'#d0ffe4');ring(cx,cy,(6+k*60)*K,(2+k*12)*K,'#5bff9e');ditherDisc(cx,cy-6*K,(20+k*50)*K,'#8a80a8',.5*(1-k))}

function render(s){
  const{toPx,figure,ditherFill,disc,ring,seg}=S,t=S.t;
  if(s.phase==='O'){S.closeup(ease(seg(.1,.4)),t>.4?1-seg(.4,.85):0,LOOK);return}
  if(s.phase==='E'){S.closeup(1-ease(seg(8.1,8.45)),0,LOOK);ditherFill(1-seg(T.close,T.close+.2),'#020105');return}
  const by=Object.fromEntries(s.chars.map(c=>[c.id,c]));
  if(s.phase==='C'){S.impact(T.imp,0,-74,s.chars,'止');return}
  S.sky(['#04030a','#08061a','#0e0a24','#1a0c26','#2a1024'],{x:S.PW*.75-s.cam.camX*.02,y:toPx(0,-330)[1]*.3+S.PH*.08,r:S.PW*.16});
  roof(s);
  const red=by.red,blue=by.blue,green=by.green;
  const pw=s.phase==='S'||s.phase==='Z'?.35:s.phase==='W'||s.phase==='J'?.3:1;
  S.aura(red.x,-50,RED.pal,pw);S.aura(blue.x,-50,BLUE.pal,pw);
  if(green.y===0)S.aura(green.x,-50,GREEN.pal,s.phase==='D'||s.phase==='H'?1:.5);
  if(s.phase==='D')dome(seg(T.hold,T.burst));
  if(s.phase==='L'||s.phase==='LH'){landing(seg(T.land,T.land+.6));S.cracks(0,ease(seg(T.land,T.land+.3)),8,70)}
  S.embers(red.x,0,RED.pal,20,pw,50);S.embers(blue.x,0,BLUE.pal,20,pw,1);
  ghostsOf(red,['#ff2e45','#8a1024','#40081a']);ghostsOf(blue,['#4fb4ff','#1f5fa8','#122a50']);ghostsOf(green,['#5bff9e','#0f6a3a','#0a2a1a']);
  figure(red,'glow');figure(blue,'glow');figure(green,'glow');
  if(red.skid>0){S.skidSparks(red.x-8,1,red.skid,3);S.skidSparks(blue.x+8,-1,blue.skid,9)}
  if(s.phase==='H'){for(const sd of[-1,1]){const[cx,cy]=toPx(sd*29,-76);disc(cx,cy,5*S.cam.k,'#ffffff');ring(cx,cy,9*S.cam.k,9*S.cam.k,'#ffffff')}}
  if(s.phase==='J')S.speedLines(Math.PI/2,22);
  if(s.phase==='B'||s.phase==='H'){S.speedLines(0,24);S.focusLines('#e8e0ff',30,2,12,...toPx(0,-74))}
  if(s.phase==='D'){if(t<T.hold+.4)S.focusLines('#d0ffe4',36,2,24,...toPx(0,-74));ditherFill(seg(T.burst-.25,T.burst),'#d0ffe4')}
  if(s.phase==='X')ditherFill(1-seg(T.burst,T.burst+.3),'#d0ffe4');
  if(s.phase==='Z')ditherFill(seg(T.push+.35,T.close),'#020105');
}
function post(s){if(s.phase!=='C'&&s.phase!=='O'&&s.phase!=='E')S.rain(.35)}

// ---------- sonido ----------
const X=S.sfx;
const sfx=[
  [.12,()=>X.sting(660)],
  [T.jump,()=>S.noise(.6,'bandpass',3000,400,.45,1)],
  [T.land,()=>{X.boom();X.crack()}],
  [T.ant,()=>X.inhale(.25)],
  [T.dash,()=>X.whoosh(.3)],
  [T.imp,X.boom],
  [T.hold+.1,()=>S.tone(.85,'sine',220,180,.25)],
  [T.burst-.25,()=>X.rise(.25)],
  [T.burst,X.bigBoom],
  [T.burst+.05,()=>X.scrape(.55)],
  [T.ask+.05,X.heartbeat],
  [T.push,()=>S.noise(.7,'lowpass',200,1400,.25,1,true)],
  [8.55,()=>S.noise(.4,'highpass',1500,7000,.18,1,true)]
];
const drone=s=>({O:.05,W:.1,J:.2,LH:0,L:.15,B:.3,H:0,C:0,D:.24,X:.18,S:.06,Z:.08,E:.03}[s.phase]??0);
const ambience=s=>{const hush=s.freeze!=null||s.phase==='C';return{rain:hush?0:.05,wind:hush?0:.04,windFreq:320}};

S.start({
  loop:LOOP,vertical:true,camCy:.5,reducedT:4.0,
  chars:{blue:BLUE,red:RED,green:GREEN},
  light:{x:200,rim:'#ff5a6a'},
  state,wind,render,post,sfx,drone,ambience,crackle:s=>s.phase==='D',
  subs:[[T.ask,T.ans,'—¿Juntos?','一緒に？'],[T.ans,T.push,'—…Por esta vez.','今回だけだ']],
  hook:[[0,1.2,'¿QUIÉN ES?','誰だ']],
  el:{stage:document.getElementById('stage'),canvas:document.getElementById('c'),toggle:document.getElementById('toggle'),
      sound:document.getElementById('sound'),sub:document.getElementById('sub'),hook:document.getElementById('hook')}
});
})();
</script>
</body></html>
